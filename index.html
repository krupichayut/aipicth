<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Secretary — คุณพิชญุตม์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
:root { --bg: #0f0f11; --bg2: #17171a; --bg3: #1e1e22; --bg4: #26262c; --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12); --text: #f0effe; --text2: #9896b0; --text3: #5a5870; --accent: #7b6ef6; --accent2: #a89bf8; --accent-bg: rgba(123,110,246,0.12); --accent-bg2: rgba(123,110,246,0.22); --green: #3ecf8e; --green-bg: rgba(62,207,142,0.1); --amber: #f6b93b; --amber-bg: rgba(246,185,59,0.1); --red: #e05572; --red-bg: rgba(224,85,114,0.1); --radius: 10px; --radius-lg: 14px; --font: 'IBM Plex Sans Thai', sans-serif; --mono: 'IBM Plex Mono', monospace; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 14px; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.topbar { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg); z-index: 50; flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.logo-icon { width: 28px; height: 28px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.topbar-mid { margin: 0 auto; display: flex; align-items: center; }
.date-badge { font-size: 12px; color: var(--text2); background: var(--bg3); border: 1px solid var(--border); padding: 4px 12px; border-radius: 20px; font-family: var(--mono); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-bg2); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--accent2); }
.layout { flex: 1; display: flex; overflow: hidden; position: relative; }
.sidebar { width: 220px; border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; background: var(--bg); z-index: 40; transition: transform 0.3s ease; flex-shrink: 0; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); z-index: 20; min-width: 0; }
.chat-panel { width: 360px; border-left: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); z-index: 30; flex-shrink: 0; }
.sidebar-section { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; padding: 12px 10px 6px; letter-spacing: 0.05em; }
.nav-btn { display: flex; align-items: center; gap: 9px; padding: 10px; border-radius: var(--radius); font-size: 13px; color: var(--text2); cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; font-family: var(--font); margin-bottom: 2px; transition: 0.2s; }
.nav-btn:hover { background: var(--bg3); color: var(--text); }
.nav-btn.active { background: var(--accent-bg); color: var(--accent2); }
.nav-btn .count { margin-left: auto; font-size: 10px; font-family: var(--mono); background: var(--bg4); padding: 2px 6px; border-radius: 10px; }
.nav-btn.active .count { background: var(--accent-bg2); color: var(--accent2); }
.nav-btn .count.red { background: var(--red-bg); color: var(--red); }
.main-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.main-title { font-size: 16px; font-weight: 600; }
.btn-primary { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-family: var(--font); cursor: pointer; font-weight: 500; transition: 0.2s; }
.btn-primary:hover { background: #6b5de6; }
.btn-primary:active { transform: scale(0.96); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.stat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.stat-val { font-size: 20px; font-weight: 600; font-family: var(--mono); }
.tasks-area { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }
.task-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: flex; gap: 12px; align-items: flex-start; position: relative; transition: border-color 0.2s; }
.task-card:hover { border-color: var(--border2); }
.task-card.done { opacity: 0.5; }
.task-cb { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 2px; transition: 0.15s; }
.task-cb:hover { border-color: var(--green); }
.task-cb.checked { background: var(--green); border-color: var(--green); }
.task-cb.checked::after { content: ''; width: 5px; height: 9px; border: 2px solid var(--bg); border-top: none; border-left: none; transform: rotate(45deg) translateY(-1px); display: block; }
.task-body { flex: 1; min-width: 0; }
.task-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; word-break: break-word; }
.task-name.done { text-decoration: line-through; color: var(--text3); }
.task-desc { font-size: 12px; color: var(--text2); margin-bottom: 10px; line-height: 1.5; word-break: break-word; }
.task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 10px; font-weight: 500; padding: 3px 8px; border-radius: 20px; display: inline-flex; }
.tag-red { background: var(--red-bg); color: var(--red); } .tag-amber { background: var(--amber-bg); color: var(--amber); } .tag-purple { background: var(--accent-bg); color: var(--accent2); }
.task-time { font-size: 11px; color: var(--text3); font-family: var(--mono); }
.btn-cal { display: inline-flex; align-items: center; gap: 4px; background: var(--bg3); border: 1px solid var(--border2); color: var(--text2); font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-family: var(--font); margin-left: auto; }
.btn-cal:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-bg); }
.btn-cal.saved { background: var(--green-bg); color: var(--green); border-color: rgba(62,207,142,0.3); pointer-events: none; }
.task-del { position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; color: var(--text3); cursor: pointer; opacity: 0; transition: 0.2s; font-size: 14px; display: flex; align-items: center; justify-content: center; }
.task-card:hover .task-del { opacity: 1; }
.task-del:hover { background: var(--red-bg); color: var(--red); }
.chat-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.ai-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); flex-shrink: 0; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.chat-title { font-size: 14px; font-weight: 500; }
.upload-btn { margin-left: auto; font-size: 12px; color: var(--text2); border: 1px dashed var(--border2); background: transparent; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; transition: 0.2s; font-family: var(--font); white-space: nowrap; }
.upload-btn:hover { border-color: var(--accent); color: var(--accent2); }
.chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg-ai .bubble { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; padding: 12px; font-size: 13px; line-height: 1.6; max-width: 95%; word-break: break-word; }
.msg-user .bubble { background: var(--accent-bg2); border: 1px solid rgba(123,110,246,0.3); border-radius: 14px 4px 14px 14px; padding: 12px; font-size: 13px; align-self: flex-end; max-width: 90%; word-break: break-word; }
.msg-meta { font-size: 10px; color: var(--text3); font-family: var(--mono); }
.msg-ai { align-items: flex-start; } .msg-user { align-items: flex-end; }
.typing-dots { display: flex; gap: 5px; align-items: center; height: 18px; }
.typing-dots span { width: 6px; height: 6px; background: var(--text3); border-radius: 50%; animation: tdot 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; } .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }
.chat-input-area { padding: 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.chat-input { flex: 1; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; color: var(--text); font-family: var(--font); resize: none; min-height: 42px; max-height: 100px; transition: border-color 0.2s; line-height: 1.5; }
.chat-input:focus { outline: none; border-color: var(--accent); }
.send-btn { width: 42px; height: 42px; background: var(--accent); border: none; border-radius: var(--radius); color: white; cursor: pointer; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.send-btn:hover { background: #6b5de6; } .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(2px); }
.modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 24px; width: 90%; max-width: 420px; }
.form-group { margin-bottom: 14px; } .form-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; font-size: 13px; color: var(--text); font-family: var(--font); transition: border-color 0.2s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-select option { background: var(--bg3); }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
.btn-cancel { background: transparent; border: 1px solid var(--border2); color: var(--text2); padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-family: var(--font); cursor: pointer; transition: 0.2s; }
.btn-cancel:hover { background: var(--bg3); color: var(--text); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border2); border-radius: 20px; padding: 10px 20px; font-size: 13px; z-index: 300; box-shadow: 0 4px 20px rgba(0,0,0,0.5); white-space: nowrap; animation: toastIn 0.2s ease; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
.mobile-nav { display: none; }
@media (max-width: 850px) {
  .topbar { padding: 0 15px; } .topbar-mid { display: none; }
  .sidebar { position: fixed; left: -100%; top: 52px; bottom: 60px; z-index: 100; box-shadow: 4px 0 20px rgba(0,0,0,0.5); }
  .sidebar.open { left: 0; }
  .main, .chat-panel { position: absolute; top: 0; bottom: 60px; left: 0; right: 0; width: 100%; border: none; transition: transform 0.25s ease; }
  .chat-panel { transform: translateX(100%); } .main { transform: translateX(0); }
  .main.hide { transform: translateX(-100%); } .chat-panel.active { transform: translateX(0); }
  .stats-row { grid-template-columns: 1fr 1fr; padding: 10px 15px; } .task-del { opacity: 1; background: var(--bg3); }
  .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg2); border-top: 1px solid var(--border); z-index: 150; }
  .mob-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text3); font-size: 11px; font-family: var(--font); cursor: pointer; transition: 0.2s; border: none; background: transparent; }
  .mob-tab.active { color: var(--accent2); } .mob-tab .icon { font-size: 20px; }
}
.loader-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 10px; color: var(--text2); font-size: 13px; }
.spinner { width: 30px; height: 30px; border: 3px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="loader-overlay" id="loader">
  <div class="spinner"></div>
  <div>กำลังซิงค์ข้อมูลจาก Cloud...</div>
</div>

<div class="topbar">
  <div class="logo"><div class="logo-icon">✦</div><span>AI Secretary</span></div>
  <div class="topbar-mid"><span class="date-badge" id="dateLabel">—</span></div>
  <div class="avatar">พ</div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <span class="sidebar-section">มุมมอง</span>
    <button class="nav-btn active" onclick="setView('today', this)">◷ งานวันนี้ <span class="count" id="todayCount">0</span></button>
    <button class="nav-btn" onclick="setView('urgent', this)">⚡ ด่วน <span class="count red" id="urgentCount">0</span></button>
    <button class="nav-btn" onclick="setView('all', this)">≡ งานทั้งหมด <span class="count" id="allCount">0</span></button>
    <button class="nav-btn" onclick="setView('done', this)">✓ เสร็จแล้ว <span class="count" id="doneCount">0</span></button>

    <span class="sidebar-section">เครื่องมือ</span>
    <button class="nav-btn" onclick="document.getElementById('pdfInput').click()">⤒ อัปโหลด PDF</button>
    <button class="nav-btn" onclick="clearChat()">↺ ล้างแชท</button>
    <button class="nav-btn" onclick="fetchTasksFromCloud()" style="margin-top:20px; color:var(--accent2)">🔄 รีเฟรชข้อมูลล่าสุด</button>
  </div>

  <div class="main" id="mainView">
    <div class="main-header">
      <div class="main-title" id="viewTitle">งานวันนี้</div>
      <button class="btn-primary" onclick="openAddModal()">+ เพิ่มงาน</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">ค้างอยู่</div><div class="stat-val" id="s-total" style="color:var(--accent2)">0</div></div>
      <div class="stat-card"><div class="stat-label">ด่วนมาก</div><div class="stat-val" id="s-urgent" style="color:var(--red)">0</div></div>
      <div class="stat-card"><div class="stat-label">เสร็จแล้ว</div><div class="stat-val" id="s-done" style="color:var(--green)">0</div></div>
      <div class="stat-card"><div class="stat-label">% สำเร็จ</div><div class="stat-val" id="s-pct" style="color:var(--amber)">0%</div></div>
    </div>
    <div class="tasks-area" id="tasksArea"></div>
  </div>

  <div class="chat-panel" id="chatView">
    <div class="chat-header">
      <div class="ai-dot"></div>
      <div class="chat-title">AI เลขาส่วนตัว</div>
      <button class="upload-btn" onclick="document.getElementById('pdfInput').click()">⤒ PDF</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="input-row">
        <textarea class="chat-input" id="chatInput" placeholder="พิมพ์สั่งงาน เช่น พรุ่งนี้มีประชุม 10 โมง..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="mobile-nav">
  <button class="mob-tab" onclick="toggleSidebar()" id="tab-menu"><span class="icon">☰</span>เมนู</button>
  <button class="mob-tab active" onclick="switchMobileView('main')" id="tab-main"><span class="icon">☑</span>งาน</button>
  <button class="mob-tab" onclick="switchMobileView('chat')" id="tab-chat"><span class="icon">💬</span>แชท</button>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target.id==='modalOverlay')closeModal()">
  <div class="modal">
    <div style="font-size:16px;font-weight:600;margin-bottom:16px;">✦ เพิ่มงานใหม่</div>
    <div class="form-group"><label class="form-label">ชื่องาน *</label><input class="form-input" id="f-name" placeholder="ระบุชื่องาน..." /></div>
    <div class="form-group"><label class="form-label">รายละเอียด</label><textarea class="form-textarea" id="f-desc" placeholder="รายละเอียดเพิ่มเติม..."></textarea></div>
    <div class="form-row">
      <div><label class="form-label">ความเร่งด่วน</label><select class="form-select" id="f-priority"><option value="normal">ปกติ</option><option value="urgent">ด่วน</option><option value="critical">ด่วนมาก</option></select></div>
      <div><label class="form-label">หมวดหมู่</label><select class="form-select" id="f-cat"><option value="ทั่วไป">ทั่วไป</option><option value="ประชุม">ประชุม</option><option value="เอกสาร">เอกสาร</option><option value="ประสานงาน">ประสานงาน</option><option value="รายงาน">รายงาน</option></select></div>
    </div>
    <div class="form-row" style="margin-top:10px;">
      <div><label class="form-label">วันกำหนดส่ง</label><input class="form-input" id="f-date" type="date" /></div>
      <div><label class="form-label">เวลา</label><input class="form-input" id="f-time" type="time" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-primary" id="btn-save-modal" onclick="saveTaskFromForm()">บันทึกงาน</button>
    </div>
  </div>
</div>

<input type="file" id="pdfInput" accept=".pdf,.txt" style="display:none;" onchange="handleFileUpload(event)">

<script>
// ==========================================
// ⚙️ วาง URL ใหม่ล่าสุดตรงนี้เลยครับ
// ==========================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbzUysnhAVQ7EloX1yR4ExbQP8fV0kUGKeJT5MwQA4EVwCYPrtlVdbfko8GZgCjRmIC0/exec";
// ==========================================

if (typeof pdfjsLib !== 'undefined') { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'; }

let tasks = [];
let currentView = 'today';
let isLoading = false;

document.addEventListener('DOMContentLoaded', () => {
  const d = new Date();
  const days = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  document.getElementById('dateLabel').textContent = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
  
  fetchTasksFromCloud();
  addAIMessage(`สวัสดีครับคุณพิชญุตม์ 👋\nอัปเดตระบบเสถียร 100% เรียบร้อยครับ ลองพิมพ์สั่งงานหรือลบงานได้เลยครับ`);
});

// ─── ระบบ Cloud ───
async function fetchTasksFromCloud() {
  document.getElementById('loader').style.display = 'flex';
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'get_tasks' })
    });
    const data = await res.json();
    if(data.success) { tasks = data.tasks; renderTasks(); }
  } catch(e) { console.error('Fetch error:', e); showToast('⚠️ ดึงข้อมูลจาก Cloud ล้มเหลว'); }
  document.getElementById('loader').style.display = 'none';
}

async function syncTasksToCloud(newTasks) {
  try {
    await fetch(GAS_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'add_tasks', tasks: newTasks })
    });
  } catch(e) { console.error('Sync error:', e); showToast('⚠️ ซิงค์ข้อมูลลง Cloud ล้มเหลว'); }
}

async function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) { 
    t.done = !t.done; 
    renderTasks(); 
    fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'toggle_task', id: id }) });
  }
}

async function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  renderTasks();
  showToast('🗑️ กำลังลบข้อมูลบน Cloud...');
  try {
    const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'delete_task', id: id }) });
    const data = await res.json();
    if(data.success) { showToast('✅ ลบงานสมบูรณ์'); }
  } catch(e) { showToast('⚠️ ไม่สามารถลบข้อมูลได้'); }
}

// ─── UI & ระบบเดิม ───
function switchMobileView(view) {
  document.getElementById('sidebar').classList.remove('open');
  const main = document.getElementById('mainView'), chat = document.getElementById('chatView');
  if (view === 'main') { main.classList.remove('hide'); chat.classList.remove('active'); document.getElementById('tab-main').classList.add('active'); document.getElementById('tab-chat').classList.remove('active'); } 
  else { main.classList.add('hide'); chat.classList.add('active'); document.getElementById('tab-chat').classList.add('active'); document.getElementById('tab-main').classList.remove('active'); setTimeout(() => { document.getElementById('chatMessages').scrollTop = 99999; }, 50); }
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function setView(v, el) {
  currentView = v; document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); el.classList.add('active');
  const titles = { today:'งานวันนี้', all:'งานทั้งหมด', urgent:'งานด่วน', done:'เสร็จแล้ว' };
  document.getElementById('viewTitle').textContent = titles[v];
  if (window.innerWidth <= 850) { toggleSidebar(); switchMobileView('main'); }
  renderTasks();
}

function renderTasks() {
  const area = document.getElementById('tasksArea'); area.innerHTML = '';
  const todayStr = new Date().toISOString().slice(0, 10);
  let filtered = tasks.filter(t => {
    if (currentView === 'done') return t.done;
    if (t.done) return false;
    if (currentView === 'today') return !t.date || t.date === todayStr;
    if (currentView === 'urgent') return t.priority === 'urgent' || t.priority === 'critical';
    return true;
  });
  if (!filtered.length) { area.innerHTML = `<div style="text-align:center;color:var(--text3);padding:48px;font-size:13px;line-height:2">ไม่พบรายการงาน<br><span style="font-size:11px">พิมพ์สั่งใน Chat หรือกด + เพิ่มงาน</span></div>`; } 
  else {
    const order = { critical:0, urgent:1, normal:2 };
    filtered.sort((a, b) => (order[a.priority]||2) - (order[b.priority]||2));
    filtered.forEach(t => area.appendChild(makeTaskCard(t)));
  }
  updateStats();
}

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

function makeTaskCard(t) {
  const div = document.createElement('div'); div.className = `task-card${t.done ? ' done' : ''}`; div.dataset.id = t.id;
  const priorityTag = t.priority === 'critical' ? '<span class="tag tag-red">⚡ ด่วนมาก</span>' : t.priority === 'urgent' ? '<span class="tag tag-amber">◷ ด่วน</span>' : '';
  const catTag  = t.cat  ? `<span class="tag tag-purple">${esc(t.cat)}</span>` : '';
  const dateStr = t.date ? `<span class="task-time">📅 ${esc(t.date)}${t.time?' '+esc(t.time):''}</span>` : '';
  const calBtn  = (t.date && !t.done) ? `<button class="btn-cal" onclick="event.stopPropagation();syncToCalendar('${esc(t.id)}')">📅 บันทึกลงปฏิทิน</button>` : '';

  div.innerHTML = `
    <div class="task-cb${t.done?' checked':''}" onclick="toggleTask('${esc(t.id)}')"></div>
    <div class="task-body"><div class="task-name${t.done?' done':''}">${esc(t.name)}</div>${t.desc ? `<div class="task-desc">${esc(t.desc)}</div>` : ''}<div class="task-meta">${priorityTag}${catTag}${dateStr}${calBtn}</div></div>
    <button class="task-del" onclick="deleteTask('${esc(t.id)}')" title="ลบ">✕</button>
  `;
  return div;
}

function clearChat() { document.getElementById('chatMessages').innerHTML = ''; addAIMessage('ล้างแชทแล้วครับ 🧹'); }

async function syncToCalendar(id) {
  const t = tasks.find(x => x.id === id); if (!t || !t.date) return;
  const btn = document.querySelector(`.task-card[data-id="${id}"] .btn-cal`);
  if (btn) { btn.innerHTML = '⏳ กำลังบันทึก...'; btn.disabled = true; }
  try {
    const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'add_calendar', task: t }) });
    const data = await res.json();
    if (data.success) { showToast('📅 บันทึกปฏิทินสำเร็จ'); if (btn) { btn.innerHTML = '✅ บันทึกแล้ว'; btn.classList.add('saved'); } } 
    else { throw new Error(data.message || 'Error'); }
  } catch (e) { showToast('⚠️ ระบบผิดพลาด ลองอีกครั้ง'); if (btn) { btn.innerHTML = '📅 บันทึกลงปฏิทิน'; btn.disabled = false; } }
}

function openAddModal() { ['f-name','f-desc'].forEach(id => document.getElementById(id).value = ''); document.getElementById('f-priority').value = 'normal'; document.getElementById('f-cat').value = 'ทั่วไป'; document.getElementById('f-date').value = new Date().toISOString().slice(0, 10); document.getElementById('f-time').value = ''; document.getElementById('modalOverlay').style.display = 'flex'; setTimeout(() => document.getElementById('f-name').focus(), 50); }
function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

async function saveTaskFromForm() {
  const name = document.getElementById('f-name').value.trim(); if (!name) return;
  const btn = document.getElementById('btn-save-modal');
  btn.disabled = true; btn.innerHTML = '⏳ กำลังบันทึก...'; // ล็อกปุ่มกันกดซ้ำ
  
  // เพิ่ม T- นำหน้าให้เป็น string เสมอ
  const newTask = { id: 'T-' + Date.now(), name, desc: document.getElementById('f-desc').value.trim(), priority: document.getElementById('f-priority').value, cat: document.getElementById('f-cat').value, date: document.getElementById('f-date').value, time: document.getElementById('f-time').value, done: false };
  tasks.push(newTask); renderTasks(); showToast('✦ กำลังเพิ่มลง Cloud...');
  
  await syncTasksToCloud([newTask]); showToast('✅ เพิ่มงานเข้า Cloud สำเร็จ');
  closeModal();
  btn.disabled = false; btn.innerHTML = 'บันทึกงาน'; // ปลดล็อกปุ่ม
}

function updateStats() {
  const pending = tasks.filter(t => !t.done), done = tasks.filter(t => t.done), urgent = pending.filter(t => t.priority === 'urgent' || t.priority === 'critical');
  document.getElementById('s-total').textContent = pending.length; document.getElementById('s-urgent').textContent = urgent.length; document.getElementById('s-done').textContent = done.length; document.getElementById('s-pct').textContent = tasks.length ? Math.round(done.length / tasks.length * 100) + '%' : '0%';
  document.getElementById('todayCount').textContent = pending.filter(t => !t.date || t.date === new Date().toISOString().slice(0, 10)).length; document.getElementById('allCount').textContent = pending.length; document.getElementById('urgentCount').textContent = urgent.length; document.getElementById('doneCount').textContent = done.length;
}

function showToast(msg) { document.querySelectorAll('.toast').forEach(el => el.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2500); }
function addAIMessage(msg) { const div = document.createElement('div'); div.className = 'msg msg-ai'; const safe = msg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.*?)\*\*/g,'<strong style="color:var(--accent2)">$1</strong>').replace(/\n/g,'<br>'); const now = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); div.innerHTML = `<div class="bubble">${safe}</div><div class="msg-meta">AI เลขา · ${now}</div>`; document.getElementById('chatMessages').appendChild(div); document.getElementById('chatMessages').scrollTop = 99999; }
function addUserMessage(msg) { const div = document.createElement('div'); div.className = 'msg msg-user'; const now = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); div.innerHTML = `<div class="bubble">${esc(msg).replace(/\n/g,'<br>')}</div><div class="msg-meta">คุณพิชญุตม์ · ${now}</div>`; document.getElementById('chatMessages').appendChild(div); document.getElementById('chatMessages').scrollTop = 99999; }
function showTyping() { const div = document.createElement('div'); div.className = 'msg msg-ai'; div.id = 'typingEl'; div.innerHTML = `<div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`; document.getElementById('chatMessages').appendChild(div); document.getElementById('chatMessages').scrollTop = 99999; }
function hideTyping() { const el = document.getElementById('typingEl'); if(el) el.remove(); }
function setUILoading(state) { isLoading = state; document.getElementById('sendBtn').disabled = state; }

async function callAPI(system, userText) {
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ system, messages: [{ content: userText }] }) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data?.content?.[0]?.text) { if (data.error) throw new Error(`AI Error: ${data.error.message}`); throw new Error('เซิร์ฟเวอร์ขัดข้อง'); }
  return data.content[0].text;
}

async function processReply(raw) {
  const match = raw.match(/<TASKS>([\s\S]*?)<\/TASKS>/);
  let clean = raw.replace(/<TASKS>[\s\S]*?<\/TASKS>/g, '').trim();
  if (match) {
    try {
      const arr = JSON.parse(match[1].trim()); let newTasks = [];
      arr.forEach(t => { 
        const nt = { id: 'T-' + Date.now() + Math.floor(Math.random()*1000), done: false, ...t }; 
        newTasks.push(nt); tasks.push(nt); 
      });
      renderTasks();
      clean = (clean ? clean + '\n\n' : '') + `✅ เพิ่มงาน ${arr.length} รายการ กำลังซิงค์ขึ้น Cloud ☁️...`;
      addAIMessage(clean);
      await syncTasksToCloud(newTasks); showToast('✅ ซิงค์เสร็จสมบูรณ์');
      return;
    } catch (e) { console.error('Parse err:', e); }
  }
  addAIMessage(clean || raw);
}

async function sendMessage() {
  const input = document.getElementById('chatInput'); const text = input.value.trim(); if (!text || isLoading) return;
  input.value = ''; input.style.height = 'auto'; addUserMessage(text); setUILoading(true); showTyping();
  
  // ย่อข้อมูลงานเดิมให้สั้นลง
  const tasksSummary = tasks.length ? tasks.map(t => `- [${t.done?'✓':'○'}] ${t.name}`).join('\n') : '(ยังไม่มีงาน)';
  
  // 🌟 อัปเดตคำสั่งควบคุม AI ให้เด็ดขาด ห้ามบันทึกซ้ำ 🌟
  const sys = `คุณคือ AI เลขาส่วนตัว วันนี้คือ ${new Date().toLocaleDateString('th-TH')}
งานปัจจุบันของคุณพิชญุตม์ (ข้อมูลอ้างอิง ห้ามส่งงานเหล่านี้กลับมาสร้างซ้ำ):
${tasksSummary}

ตอบสั้น กระชับ เป็นมืออาชีพ หากผู้ใช้สั่ง "เพิ่มงานใหม่" ให้แทรก JSON **เฉพาะงานที่เพิ่งสั่งใหม่เท่านั้น** ไว้ท้ายข้อความ:
<TASKS>[{"name":"...","desc":"...","priority":"normal|urgent|critical","cat":"...","date":"YYYY-MM-DD หรือ null","time":"HH:MM หรือ null"}]</TASKS>`;
  
  try { const reply = await callAPI(sys, text); hideTyping(); await processReply(reply); } catch (e) { hideTyping(); addAIMessage(`⚠️ ขัดข้อง: ${e.message}`); } finally { setUILoading(false); }
}

async function handleFileUpload(e) {
  const file = e.target.files[0]; if (!file) return; e.target.value = ''; addUserMessage(`📎 ส่งไฟล์: ${file.name}`); setUILoading(true); showTyping();
  try {
    let txt = ''; if (file.type === 'text/plain') { txt = await file.text(); } else { const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; for (let i = 1; i <= pdf.numPages; i++) { const page = await pdf.getPage(i); const content = await page.getTextContent(); txt += content.items.map(x => x.str).join(' ') + '\n'; } }
    if (!txt.trim()) throw new Error('ไม่พบข้อความ');
    
    // 🌟 อัปเดตคำสั่งตอนอ่าน PDF 🌟
    const sys = `คุณคือ AI เลขาส่วนตัว สรุปเอกสารนี้และดึงเฉพาะ "ภาระงานที่ต้องทำ" ออกมาในรูปแบบ JSON:\n<TASKS>[{"name":"...","desc":"...","priority":"normal|urgent|critical","cat":"...","date":"YYYY-MM-DD หรือ null","time":"HH:MM หรือ null"}]</TASKS>`;
    
    const reply = await callAPI(sys, `ไฟล์ ${file.name}:\n${txt.slice(0, 5000)}`); hideTyping(); await processReply(reply);
  } catch (err) { hideTyping(); addAIMessage(`⚠️ ขัดข้อง: ${err.message}`); } finally { setUILoading(false); }
}
</script>
